name: purrsync
description: A Mobile-Based Health, Vaccination, and Nutrition Tracking System for Multi-Cat Households
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0

  # REST API layer (direct HTTP calls to the Firestore REST API - see
  # lib/services/api_service.dart and lib/screens/api_test_screen.dart)
  http: ^1.1.0
  
  # UI & Charts
  intl: ^0.18.1
  fl_chart: ^0.66.0
  
  # Notifications
  flutter_local_notifications: ^16.3.0
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.1
  
  # Utilities
  image_picker: ^1.0.5
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  timezone: ^0.9.2
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 800
