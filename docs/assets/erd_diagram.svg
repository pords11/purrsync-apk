<svg viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="900" height="660" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#c25a00">PurrSync — Database Design (Cloud Firestore)</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#777">NoSQL document collections. Relationships are foreign-key style references (userId, catId), not enforced joins.</text>

  <!-- users -->
  <g>
    <rect x="40" y="90" width="230" height="150" rx="8" fill="#eaf3ff" stroke="#7fb0e6" stroke-width="1.5"/>
    <rect x="40" y="90" width="230" height="30" rx="8" fill="#1b5faa"/>
    <text x="155" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">users</text>
    <text x="55" y="140" font-size="11.5" fill="#333">id (doc ID = Firebase UID)</text>
    <text x="55" y="158" font-size="11.5" fill="#333">email: string</text>
    <text x="55" y="176" font-size="11.5" fill="#333">fullName: string</text>
    <text x="55" y="194" font-size="11.5" fill="#333">createdAt: timestamp</text>
  </g>

  <!-- cats -->
  <g>
    <rect x="335" y="90" width="240" height="196" rx="8" fill="#fff3e6" stroke="#f0a35f" stroke-width="1.5"/>
    <rect x="335" y="90" width="240" height="30" rx="8" fill="#c25a00"/>
    <text x="455" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">cats</text>
    <text x="350" y="140" font-size="11.5" fill="#333">id (doc ID)</text>
    <text x="350" y="158" font-size="11.5" fill="#333">userId: string (FK → users)</text>
    <text x="350" y="176" font-size="11.5" fill="#333">name: string</text>
    <text x="350" y="194" font-size="11.5" fill="#333">breed: string</text>
    <text x="350" y="212" font-size="11.5" fill="#333">weight: number</text>
    <text x="350" y="230" font-size="11.5" fill="#333">birthDate: timestamp?</text>
    <text x="350" y="248" font-size="11.5" fill="#333">imageUrl: string?</text>
    <text x="350" y="266" font-size="11.5" fill="#333">diet, vaccine: map (initial values)</text>
  </g>

  <!-- weight_logs -->
  <g>
    <rect x="640" y="60" width="220" height="120" rx="8" fill="#eafaf0" stroke="#7fcf9e" stroke-width="1.5"/>
    <rect x="640" y="60" width="220" height="28" rx="8" fill="#177a3f"/>
    <text x="750" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">weight_logs</text>
    <text x="655" y="108" font-size="11.5" fill="#333">id (doc ID)</text>
    <text x="655" y="126" font-size="11.5" fill="#333">catId: string (FK → cats)</text>
    <text x="655" y="144" font-size="11.5" fill="#333">weight: number</text>
    <text x="655" y="162" font-size="11.5" fill="#333">date: timestamp, notes: string?</text>
  </g>

  <!-- vaccines -->
  <g>
    <rect x="640" y="200" width="220" height="120" rx="8" fill="#eafaf0" stroke="#7fcf9e" stroke-width="1.5"/>
    <rect x="640" y="200" width="220" height="28" rx="8" fill="#177a3f"/>
    <text x="750" y="219" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">vaccines</text>
    <text x="655" y="248" font-size="11.5" fill="#333">id (doc ID)</text>
    <text x="655" y="266" font-size="11.5" fill="#333">catId: string (FK → cats)</text>
    <text x="655" y="284" font-size="11.5" fill="#333">type, clinicName, vet: string</text>
    <text x="655" y="302" font-size="11.5" fill="#333">dateGiven, nextDueDate: timestamp</text>
  </g>

  <!-- vet_visits -->
  <g>
    <rect x="640" y="340" width="220" height="120" rx="8" fill="#eafaf0" stroke="#7fcf9e" stroke-width="1.5"/>
    <rect x="640" y="340" width="220" height="28" rx="8" fill="#177a3f"/>
    <text x="750" y="359" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">vet_visits</text>
    <text x="655" y="388" font-size="11.5" fill="#333">id (doc ID)</text>
    <text x="655" y="406" font-size="11.5" fill="#333">catId: string (FK → cats)</text>
    <text x="655" y="424" font-size="11.5" fill="#333">clinicName, reason, diagnosis: string</text>
    <text x="655" y="442" font-size="11.5" fill="#333">visitDate, followUpDate?: timestamp</text>
  </g>

  <!-- api_test_logs -->
  <g>
    <rect x="335" y="330" width="240" height="110" rx="8" fill="#fdf6e3" stroke="#e0c46c" stroke-width="1.5"/>
    <rect x="335" y="330" width="240" height="28" rx="8" fill="#8a6d00"/>
    <text x="455" y="349" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">api_test_logs</text>
    <text x="350" y="378" font-size="11.5" fill="#333">id (doc ID, auto-generated)</text>
    <text x="350" y="396" font-size="11.5" fill="#333">note: string</text>
    <text x="350" y="414" font-size="11.5" fill="#333">createdAt: timestamp</text>
    <text x="350" y="430" font-size="10" fill="#777">Written only via the raw REST API layer</text>
  </g>

  <!-- Relationship lines -->
  <line x1="270" y1="165" x2="335" y2="165" stroke="#555555" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="300" y="158" font-size="10" fill="#555">1 : N</text>

  <line x1="575" y1="140" x2="640" y2="120" stroke="#555555" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="588" y="122" font-size="10" fill="#555">1 : N</text>

  <line x1="575" y1="180" x2="640" y2="260" stroke="#555555" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="588" y="215" font-size="10" fill="#555">1 : N</text>

  <line x1="575" y1="230" x2="640" y2="400" stroke="#555555" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="588" y="330" font-size="10" fill="#555">1 : N</text>

  <!-- Legend / notes -->
  <rect x="40" y="500" width="820" height="140" rx="10" fill="#f7f7f7" stroke="#dddddd"/>
  <text x="58" y="524" font-size="13" font-weight="bold" fill="#333">Notes</text>
  <text x="58" y="548" font-size="11.5" fill="#333">• All collections are top-level (flat), not nested sub-collections, to keep client-side queries simple.</text>
  <text x="58" y="568" font-size="11.5" fill="#333">• "FK" relationships are enforced in application code (FirebaseService), not by Firestore itself - Firestore has no foreign keys.</text>
  <text x="58" y="588" font-size="11.5" fill="#333">• cats.userId scopes each cat to its owner; weight_logs/vaccines/vet_visits.catId scopes records to their cat.</text>
  <text x="58" y="608" font-size="11.5" fill="#333">• Offline persistence is enabled app-wide, so reads/writes are cached locally and synced when connectivity returns.</text>
  <text x="58" y="628" font-size="11.5" fill="#333">• api_test_logs requires its own Firestore security rule (allow read, write: if request.auth != null;) - see API_Integration.md.</text>
</svg>
