name: Build PurrSync APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure Android platform files exist
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi

      - name: Enable Core Library Desugaring
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          if grep -q "isCoreLibraryDesugaringEnabled" ""; then
            echo "Already enabled"
          else
            sed -i '/defaultConfig {/a \    minSdk 21\n    multiDexEnabled true\n    coreLibraryDesugaringEnabled true' ""
          fi
          
          # Add multi-dex and desugar dependency if not present
          DEPENDENCIES="dependencies {"
          if ! grep -q "coreLibraryDesugaring" ""; then
            sed -i '/dependencies {/a \    coreLibraryDesugaring '\''com.android.tools:desugar_jdk_libs:2.0.4'\''' ""
          fi

      - name: Get packages
        run: flutter pub get

      - name: Patch flutter_local_notifications bigLargeIcon bug
        run: |
          find /home/runner/.pub-cache -name "FlutterLocalNotificationsPlugin.java" -exec sed -i 's/bigPictureStyle.bigLargeIcon(null);/bigPictureStyle.bigLargeIcon((android.graphics.Bitmap) null);/g' {} +

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: purrsync-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
